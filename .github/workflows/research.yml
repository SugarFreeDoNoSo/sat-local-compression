name: Research checks and manuscript

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: research-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  checks:
    name: Research and finite experiments
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          persist-credentials: false
      - name: Record Python version
        run: python3 --version
      - name: Check metadata, finite examples, and generated data
        run: make check

  manuscript:
    name: Build manuscript
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          persist-credentials: false
      - name: Install the TeX toolchain
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends latexmk texlive-latex-extra texlive-fonts-recommended lmodern
      - name: Build and validate the manuscript
        run: |
          make pdf
          python3 scripts/check_tex_log.py
      - name: Upload the PDF and build logs
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: manuscript-${{ github.sha }}
          path: |
            build/paper/main.pdf
            build/paper/main.log
            build/paper/build.log
          if-no-files-found: error
          retention-days: 30

  formal:
    name: Verify L02 in Lean
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          persist-credentials: false
      - name: Install the pinned and hash-verified Lean toolchain
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends zstd
          python3 scripts/setup_lean.py
      - name: Verify the proof and audit axiom dependencies
        run: make formal LAKE="$PWD/build/lean/lean-4.35.0-linux/bin/lake"
      - name: Upload formal verification evidence
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: formal-L02-${{ github.sha }}
          path: build/formal/
          if-no-files-found: warn
          retention-days: 30

  release:
    name: Publish manuscript PDF
    needs: [checks, manuscript, formal]
    if: (github.event_name == 'push' || github.event_name == 'workflow_dispatch') && github.ref == 'refs/heads/main'
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    permissions:
      actions: read
      contents: write
    steps:
      - name: Download the validated PDF and publish a Release
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        run: |
          gh run download "$GITHUB_RUN_ID" --name "manuscript-$GITHUB_SHA" --dir build/paper
          test -s build/paper/main.pdf
          release_tag="manuscript-$GITHUB_SHA"
          if gh release view "$release_tag" > /dev/null 2>&1; then
            gh release upload "$release_tag" build/paper/main.pdf --clobber
          else
            gh release create "$release_tag" build/paper/main.pdf \
              --target "$GITHUB_SHA" \
              --title "Manuscript ${GITHUB_SHA:0:7}" \
              --notes "Automated manuscript build for commit $GITHUB_SHA. Working draft; independent mathematical review is pending." \
              --latest
          fi
